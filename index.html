<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>わたしの日本語ページ 🌸</title>
<meta name="theme-color" content="#ffd6e8">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="日本語ページ">
<script>
// ホーム画面追加用マニフェスト（生徒さんごとのURLを保つため動的に生成）
(function () {
  const manifest = {
    name: "わたしの日本語ページ",
    short_name: "日本語ページ",
    start_url: "index.html" + location.search,
    scope: location.pathname.replace(/index\.html$/, ""),
    display: "standalone",
    background_color: "#fff0f6",
    theme_color: "#ffd6e8",
    icons: [
      { src: new URL("icon-192.png", location.href).href, sizes: "192x192", type: "image/png" },
      { src: new URL("icon-512.png", location.href).href, sizes: "512x512", type: "image/png" }
    ]
  };
  const link = document.createElement("link");
  link.rel = "manifest";
  link.href = URL.createObjectURL(new Blob([JSON.stringify(manifest)], { type: "application/json" }));
  document.head.appendChild(link);
})();
</script>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- パスコード入り口 -->
<div id="gate" class="gate hidden">
  <h2>🌸 ようこそ！</h2>
  <p>パスコードを入れてください<br>Please enter your passcode</p>
  <input id="passcode-input" type="text" inputmode="numeric" maxlength="6" placeholder="****">
  <button id="passcode-btn">はいる ➜</button>
  <div id="gate-error" class="error"></div>
</div>

<!-- メイン -->
<div id="main" class="container hidden">
  <div class="header">
    <h1>🌸 わたしの日本語ページ</h1>
    <div class="student-name" id="student-name"></div>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="lessons">📖 クラスまとめ<span class="tab-en">Class Summary</span></button>
    <button class="tab" data-tab="vocab">📚 単語帳<span class="tab-en">Vocabulary</span></button>
    <button class="tab" data-tab="review">🃏 復習<span class="tab-en">Flashcards</span></button>
    <button class="tab" data-tab="homework">📝 宿題<span class="tab-en">Homework</span></button>
    <button class="tab" data-tab="progress">🌱 進捗<span class="tab-en">Progress</span></button>
    <button class="tab" data-tab="apps">🎮 アプリ<span class="tab-en">Apps</span></button>
  </div>

  <div id="tab-lessons" class="tab-content"></div>
  <div id="tab-vocab" class="tab-content hidden">
    <div class="vocab-controls">
      <input id="vocab-search" type="text" placeholder="🔍 ことばを さがす">
      <select id="vocab-filter">
        <option value="">ぜんぶ</option>
        <option value="noun">noun（名詞）</option>
        <option value="verb">verb（動詞）</option>
        <option value="i-adjective">i-adjective</option>
        <option value="na-adjective">na-adjective</option>
        <option value="adverb">adverb（副詞）</option>
        <option value="particle">particle（助詞）</option>
      </select>
    </div>
    <div class="vocab-stats" id="vocab-stats"></div>
    <div id="vocab-list"></div>
  </div>
  <div id="tab-review" class="tab-content hidden"></div>
  <div id="tab-homework" class="tab-content hidden"></div>
  <div id="tab-progress" class="tab-content hidden"></div>
  <div id="tab-apps" class="tab-content hidden"></div>
</div>

<script src="js/firebase-config.js?v=13"></script>
<script type="module">
  await import("./js/store.js?v=13");
  const sid = new URLSearchParams(location.search).get("s") || "caspar-k7x2";
  await Store.initForStudent(sid);
  await import("./js/app.js?v=13");
</script>
</body>
</html>
